# Render Blueprint — the API on Render's free web service.
# Render → New → Blueprint → pick this repo, once. That is all you do on Render:
# secrets stay in GitHub and .github/workflows/deploy.yml copies them here on
# every deploy (it also triggers the deploy, so autoDeploy is off — nothing
# ships before CI is green).
services:
  - type: web
    name: metravo-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - { key: PYTHON_VERSION, value: "3.12.7" }
      - { key: APP_ENV, value: prod }
      - { key: TENANT_PROVISIONER, value: turso }
      - { key: AUTH_PROVIDERS, value: firebase }
      - { key: BILLING_PROVIDER, value: none }   # stripe, when Pro goes on sale
      - { key: PRO_AVAILABLE_FROM, value: "2026-11-15" } # Pro shows as "coming soon" until then
      - { key: SCHEDULER_ENABLED, value: "true" } # the API scans on its own, no cron
      - { key: JWT_SECRET, generateValue: true }  # made by Render once, never leaves it
