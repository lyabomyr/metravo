[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
    "B008",   # FastAPI's Depends() in defaults is the framework's idiom
    "B027",   # optional no-op hooks on ABCs are intentional
    "UP038",  # isinstance(x, (A, B)) is clearer and faster than A | B
]

[tool.ruff.lint.per-file-ignores]
"app/core/i18n/catalogs/*.py" = ["E501"]  # one sentence per line reads better than a wrapped one
