<form class="stack" [formGroup]="form" (ngSubmit)="submit()">
  <div class="row">
    <div class="segmented" role="radiogroup" aria-label="Deal">
      <label><input type="radio" formControlName="deal_type" value="sale" data-cy="deal-sale" /> Buy</label>
      <label><input type="radio" formControlName="deal_type" value="rent" data-cy="deal-rent" /> Rent</label>
    </div>
    <div class="segmented" role="radiogroup" aria-label="Property">
      <label><input type="radio" formControlName="property_type" value="flat" data-cy="property-flat" /> Flat</label>
      <label><input type="radio" formControlName="property_type" value="house" data-cy="property-house" /> House</label>
    </div>
  </div>

  <section>
    <h3 class="section-title">Search</h3>
    <div class="list">
      <label class="list__row">
        <span>Name</span>
        <input formControlName="name" data-cy="search-name" />
      </label>
      <label class="list__row">
        <span>City</span>
        <select formControlName="city" data-cy="search-city">
          @for (city of config.cities; track city.key) {
            <option [value]="city.key">{{ city.label }}</option>
          }
        </select>
      </label>
      <label class="list__row">
        <span>Check for new</span>
        <select formControlName="interval_minutes" data-cy="search-interval">
          @for (minutes of config.scan_intervals; track minutes) {
            <option [ngValue]="minutes" [disabled]="minutes < planFloor()">
              {{ describe(minutes) }}{{ minutes < planFloor() ? ' · Pro' : '' }}
            </option>
          }
        </select>
      </label>
    </div>
  </section>

  <section>
    <h3 class="section-title">Price</h3>
    <div class="list">
      <label class="list__row">
        <span>{{ form.controls.deal_type.value === 'rent' ? 'Max rent, zł / month' : 'Budget, zł' }}</span>
        <input type="number" inputmode="numeric" formControlName="max_price" data-cy="search-max-price" />
      </label>
      <label class="list__row">
        <span>Min price, zł</span>
        <input type="number" inputmode="numeric" formControlName="min_price" placeholder="Any" />
      </label>
      <label class="list__row">
        <span>Max zł per m²</span>
        <input type="number" inputmode="numeric" formControlName="max_price_per_m2" placeholder="Any" data-cy="search-max-per-m2" />
      </label>
    </div>
  </section>

  <section>
    <h3 class="section-title">Size</h3>
    <div class="list">
      <label class="list__row">
        <span>Min area, m²</span>
        <input type="number" inputmode="decimal" formControlName="min_area" data-cy="search-min-area" />
      </label>
      <label class="list__row">
        <span>Max area, m²</span>
        <input type="number" inputmode="decimal" formControlName="max_area" placeholder="Any" />
      </label>
      <label class="list__row">
        <span>Rooms from</span>
        <input type="number" inputmode="numeric" formControlName="min_rooms" placeholder="Any" data-cy="search-min-rooms" />
      </label>
      <label class="list__row">
        <span>Rooms up to</span>
        <input type="number" inputmode="numeric" formControlName="max_rooms" placeholder="Any" />
      </label>
      <label class="list__row">
        <span>Built after</span>
        <input type="number" inputmode="numeric" formControlName="min_build_year" placeholder="Any" />
      </label>
    </div>
  </section>

  <section>
    <h3 class="section-title">Must mention</h3>
    <div class="list">
      <label class="list__row list__row--stacked">
        <input formControlName="required_keywords" placeholder="balkon, winda" data-cy="search-required" />
      </label>
    </div>
    <p class="section-note">Comma-separated. Leave empty to accept any listing.</p>
  </section>

  <section>
    <h3 class="section-title">Portals</h3>
    <div class="list">
      @for (source of config.sources; track source) {
        <label class="list__row" [class.list__row--disabled]="!supports(source)">
          <span>
            {{ source }}
            @if (!supports(source)) {
              <span class="list__hint"> · not available for this search</span>
            }
          </span>
          <input
            class="switch"
            type="checkbox"
            [checked]="selectedSources().has(source) && supports(source)"
            [disabled]="!supports(source)"
            (change)="toggleSource(source, $any($event.target).checked)"
            [attr.data-cy]="'source-' + source"
          />
        </label>
      }
    </div>
  </section>

  <button class="button button--primary button--block" type="submit" [disabled]="busy() || form.invalid" data-cy="search-save">
    {{ submitLabel() }}
  </button>
</form>
