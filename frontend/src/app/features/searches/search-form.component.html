<form class="stack" [formGroup]="form" (ngSubmit)="submit()">
  <div class="row">
    <div class="segmented" role="radiogroup" [attr.aria-label]="'form.search' | t">
      <label><input type="radio" formControlName="deal_type" value="sale" data-cy="deal-sale" /> {{ 'deal.sale' | t }}</label>
      <label><input type="radio" formControlName="deal_type" value="rent" data-cy="deal-rent" /> {{ 'deal.rent' | t }}</label>
    </div>
    <div class="segmented" role="radiogroup">
      <label><input type="radio" formControlName="property_type" value="flat" data-cy="property-flat" /> {{ 'property.flat' | t }}</label>
      <label><input type="radio" formControlName="property_type" value="house" data-cy="property-house" /> {{ 'property.house' | t }}</label>
    </div>
  </div>

  <section>
    <h3 class="section-title">{{ 'form.search' | t }}</h3>
    <div class="list">
      <label class="list__row">
        <span>{{ 'form.name' | t }}</span>
        <input formControlName="name" data-cy="search-name" />
      </label>
      <label class="list__row">
        <span>{{ 'form.frequency' | t }}</span>
        <select formControlName="interval_minutes" data-cy="search-interval">
          @for (minutes of config.scan_intervals; track minutes) {
            <option [ngValue]="minutes" [disabled]="minutes < planFloor()">
              {{ minutes | interval }}{{ minutes < planFloor() ? ' · Pro' : '' }}
            </option>
          }
        </select>
      </label>
    </div>
    <p class="section-note">{{ 'form.frequencyHint' | t }}</p>
  </section>

  <section>
    <h3 class="section-title">{{ 'form.where' | t }}</h3>
    <app-place-picker
      [place]="form.controls.place.value"
      [radiusKm]="form.controls.radius_km.value"
      [radiusChoices]="config.radius_choices"
      (placeChange)="form.controls.place.setValue($event)"
      (radiusChange)="form.controls.radius_km.setValue($event)"
    />
  </section>

  <section>
    <h3 class="section-title">{{ 'form.price' | t }}</h3>
    <div class="list">
      <label class="list__row">
        <span>{{ (form.controls.deal_type.value === 'rent' ? 'form.rentFrom' : 'form.priceFrom') | t }}</span>
        <input type="number" inputmode="numeric" formControlName="min_price" [placeholder]="'common.any' | t" data-cy="search-min-price" />
      </label>
      <label class="list__row">
        <span>{{ (form.controls.deal_type.value === 'rent' ? 'form.rentTo' : 'form.priceTo') | t }}</span>
        <input type="number" inputmode="numeric" formControlName="max_price" [placeholder]="'common.any' | t" data-cy="search-max-price" />
      </label>
      <label class="list__row">
        <span>{{ 'form.maxPerM2' | t }}</span>
        <input type="number" inputmode="numeric" formControlName="max_price_per_m2" [placeholder]="'common.any' | t" data-cy="search-max-per-m2" />
      </label>
    </div>
  </section>

  <section>
    <h3 class="section-title">{{ 'form.size' | t }}</h3>
    <div class="list">
      <label class="list__row">
        <span>{{ 'form.minArea' | t }}</span>
        <input type="number" inputmode="decimal" formControlName="min_area" [placeholder]="'common.any' | t" data-cy="search-min-area" />
      </label>
      <label class="list__row">
        <span>{{ 'form.maxArea' | t }}</span>
        <input type="number" inputmode="decimal" formControlName="max_area" [placeholder]="'common.any' | t" data-cy="search-max-area" />
      </label>
      <label class="list__row">
        <span>{{ 'form.roomsFrom' | t }}</span>
        <input type="number" inputmode="numeric" formControlName="min_rooms" [placeholder]="'common.any' | t" data-cy="search-min-rooms" />
      </label>
      <label class="list__row">
        <span>{{ 'form.roomsTo' | t }}</span>
        <input type="number" inputmode="numeric" formControlName="max_rooms" [placeholder]="'common.any' | t" data-cy="search-max-rooms" />
      </label>
      <label class="list__row">
        <span>{{ 'form.builtAfter' | t }}</span>
        <input type="number" inputmode="numeric" formControlName="min_build_year" [placeholder]="'common.any' | t" data-cy="search-build-year" />
      </label>
    </div>
  </section>

  <section>
    <h3 class="section-title">{{ 'form.words' | t }}</h3>
    <div class="list">
      <label class="list__row list__row--stacked">
        <span>{{ 'form.mustMention' | t }}</span>
        <input formControlName="required_keywords" [placeholder]="'form.mustMentionExample' | t" data-cy="search-required" />
      </label>
      <label class="list__row list__row--stacked">
        <span>{{ 'form.mustNotMention' | t }}</span>
        <input formControlName="reject_keywords" [placeholder]="'form.mustNotMentionExample' | t" data-cy="search-reject" />
      </label>
    </div>
    <p class="section-note">{{ 'form.wordsHint' | t }}</p>
  </section>

  <section>
    <h3 class="section-title">{{ 'form.portals' | t }}</h3>
    <div class="list">
      @for (source of config.sources; track source) {
        <label class="list__row" [class.list__row--disabled]="!supports(source)">
          <span>
            {{ source }}
            @if (!supports(source)) {
              <span class="list__hint"> · {{ 'form.notAvailable' | t }}</span>
            } @else if (!planAllows(source)) {
              <span class="badge badge--pro">Pro</span>
            }
          </span>
          <input
            class="switch"
            type="checkbox"
            [checked]="selectedSources().has(source) && supports(source)"
            [disabled]="!supports(source)"
            (change)="toggleSource(source, $any($event.target).checked)"
            [attr.data-cy]="'source-' + source"
          />
        </label>
      }
    </div>
  </section>

  <button class="button button--primary button--block" type="submit" [disabled]="busy() || form.invalid" data-cy="search-save">
    {{ submitLabel() || ('common.save' | t) }}
  </button>
</form>
