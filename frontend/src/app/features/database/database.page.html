<app-page-header [title]="'data.title' | t" [subtitle]="'data.subtitle' | t" />

<app-error-banner [error]="error()" />

<section class="card stack">
  <h2>📊 {{ 'data.download' | t }}</h2>
  <p class="muted">{{ 'data.downloadHint' | t }}</p>
  <div class="row">
    <button class="button button--primary" type="button" (click)="downloadCsv()" [disabled]="loading()" data-cy="download-csv">
      {{ 'data.csv' | t }}
    </button>
  </div>
</section>
