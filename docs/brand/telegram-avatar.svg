<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ac8fa"/>
      <stop offset="0.55" stop-color="#007aff"/>
      <stop offset="1" stop-color="#5856d6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.25" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="640" height="640">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1b1464" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Full bleed: Telegram crops a circle out of the square. -->
  <rect width="640" height="640" fill="url(#bg)"/>
  <rect width="640" height="640" fill="url(#glow)"/>
  <!-- The app's house mark, scaled from its 24-unit icon. -->
  <g filter="url(#shadow)">
    <g transform="translate(320 340) scale(15) translate(-12 -12)" fill="#fff">
      <path d="M12 3 2.5 10.6a1 1 0 0 0 1.25 1.56L5 11.15V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-8.85l1.25 1.01a1 1 0 0 0 1.25-1.56z"/>
    </g>
  </g>
  <!-- "Something new": the alert badge. -->
  <g filter="url(#shadow)">
    <circle cx="458" cy="190" r="58" fill="#ff3b30"/>
    <circle cx="458" cy="190" r="58" fill="none" stroke="#fff" stroke-width="12"/>
  </g>
  <text x="458" y="215" text-anchor="middle" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#fff">1</text>
</svg>
