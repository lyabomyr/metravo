name: ci

# Every push and pull request: lint, unit tests, a production build and the
# full Cypress suite against the real backend running with fake adapters.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build
      - name: Uptime worker logic
        run: node --test ../infra/worker/uptime.test.mjs
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: frontend/dist/metravo-web/browser }

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      APP_ENV: e2e
      PAGE_FETCHER: fixtures
      FIXTURES_DIR: ${{ github.workspace }}/backend/tests/fixtures/pages
      CONTROL_DB_URL: sqlite:///${{ github.workspace }}/backend/data/control.db
      ADMIN_EMAILS: admin@metravo.test
      SCAN_DELAY_SECONDS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - name: Start the API and the site
        # Plain curl instead of the Cypress action's wait-on, which gives up
        # at once on Node 24 ("Socket closed") instead of retrying.
        run: |
          (cd backend && nohup uvicorn app.main:create_app --factory --port 8000 > /tmp/api.log 2>&1 &)
          (cd frontend && nohup npx ng serve --port 4200 > /tmp/web.log 2>&1 &)
          for url in http://localhost:8000/api/health http://localhost:4200; do
            timeout 180 bash -c "until curl -sf $url > /dev/null; do sleep 2; done" || { cat /tmp/api.log /tmp/web.log; exit 1; }
          done
      - name: Cypress
        working-directory: e2e
        run: |
          npm ci
          npx cypress run
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: cypress-screenshots, path: e2e/cypress/screenshots }
