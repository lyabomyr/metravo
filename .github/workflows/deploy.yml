name: deploy

# After CI passes on main: apply the infrastructure (infra/terraform), push
# settings to the API on Render and deploy it, publish the site to Cloudflare
# Pages, point the Telegram bot at the API.
#
# GitHub Secrets are the only place settings are kept — this workflow hands
# them to Render and finds both public URLs by itself. Every step is skipped
# until its secret exists. See docs/SETUP.md.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write   # tfstate.sh saves the encrypted state to the infra-state branch

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      TF_VAR_state_passphrase: ${{ secrets.TF_STATE_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4

      - name: Find the API address
        id: api_url
        if: env.RENDER_API_KEY != ''
        run: python3 .github/scripts/deploy.py render-url

      - uses: opentofu/setup-opentofu@v1
        if: env.CLOUDFLARE_API_TOKEN != '' && env.TF_VAR_state_passphrase != ''
        with: { tofu_version: 1.13.1, tofu_wrapper: false }

      - name: Infrastructure (OpenTofu)
        id: pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.TF_VAR_state_passphrase != ''
        # The app still ships if infrastructure fails (the site and API already
        # exist); the last step turns the run red so the failure is not missed.
        continue-on-error: true
        working-directory: infra/terraform
        env:
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_api_url: ${{ vars.API_URL || steps.api_url.outputs.url || 'https://metravo-api.onrender.com' }}
          TF_VAR_admin_emails: ${{ vars.ADMIN_EMAILS || secrets.ADMIN_EMAILS }}
          TF_VAR_telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TF_VAR_control_db_url: ${{ secrets.CONTROL_DB_URL }}
          TF_VAR_control_db_token: ${{ secrets.CONTROL_DB_TOKEN }}
        run: |
          ../../.github/scripts/tfstate.sh pull
          tofu init -input=false
          tofu apply -input=false -auto-approve || { ../../.github/scripts/tfstate.sh push; exit 1; }
          ../../.github/scripts/tfstate.sh push
          echo "url=$(tofu output -raw site_url)" >> "$GITHUB_OUTPUT"

      - name: API on Render — settings and deploy
        id: api
        if: env.RENDER_API_KEY != ''
        env:
          CONTROL_DB_URL: ${{ secrets.CONTROL_DB_URL }}
          CONTROL_DB_TOKEN: ${{ secrets.CONTROL_DB_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || vars.FIREBASE_PROJECT_ID }}
          FIREBASE_WEB_CONFIG: ${{ secrets.FIREBASE_WEB_CONFIG || vars.FIREBASE_WEB_CONFIG }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME || vars.TELEGRAM_BOT_USERNAME }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS || vars.ADMIN_EMAILS }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_PRO: ${{ secrets.STRIPE_PRICE_PRO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          # The Pages URL from OpenTofu; the project's default address if that step was skipped.
          FRONTEND_URL: ${{ vars.FRONTEND_URL || steps.pages.outputs.url || 'https://metravo.pages.dev' }}
        run: python3 .github/scripts/deploy.py render

      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }

      - name: Build and publish the site
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: frontend
        env:
          API_URL: ${{ vars.API_URL || steps.api.outputs.url }}
        run: |
          npm ci
          npx ng build
          echo "{ \"apiUrl\": \"${API_URL}\" }" > dist/metravo-web/browser/runtime-config.json
          npx --yes wrangler@4 pages deploy dist/metravo-web/browser --project-name=metravo --branch=main

      - name: Point the Telegram bot at the API
        if: env.TELEGRAM_BOT_TOKEN != '' && (vars.API_URL != '' || steps.api.outputs.url != '')
        env:
          API_URL: ${{ vars.API_URL || steps.api.outputs.url }}
        run: |
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            -d "url=${API_URL}/api/telegram/webhook" \
            -d "secret_token=${TELEGRAM_WEBHOOK_SECRET}" \
            -d 'allowed_updates=["message","my_chat_member"]'

      - name: Check production end to end
        if: vars.API_URL != '' || steps.api.outputs.url != ''
        env:
          API_URL: ${{ vars.API_URL || steps.api.outputs.url }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL || steps.pages.outputs.url || 'https://metravo.pages.dev' }}
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
          CONTROL_DB_URL: ${{ secrets.CONTROL_DB_URL }}
          TURSO_ORG: ${{ secrets.TURSO_ORG || vars.TURSO_ORG }}
        run: python3 .github/scripts/smoke.py

      - name: Infrastructure failed — see the "Infrastructure (OpenTofu)" step
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::error::OpenTofu could not apply infra/terraform. The app was deployed; the infrastructure change was not."
          exit 1
